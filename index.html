<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#127a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<title>Pendientes – Winflex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1f9d63;--verde-osc:#127a4a;--verde-cl:#eef7f2;--verde-b:#cfe7db;--verde-l:#46c872;
  --naranja:#d9793a;--naranja-osc:#9c5420;--naranja-cl:#fbf2ea;--naranja-b:#efd7c1;
  --rojo:#b4574c;--rojo-cl:#faefed;--rojo-b:#eecfc9;
  --tinta:#28352f;--gris2:#42544c;--gris:#7b8b83;--grisw:#57595b;--bg:#eaf0ed;--panel:#fff;--line:#e5ebe8;--line2:#f3f6f4;--nav:#dde7e2;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Archivo','IBM Plex Sans',sans-serif;
  --wm:none;color-scheme:light;--hh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --verde:#35b979;--verde-osc:#4fcb8c;--verde-cl:#16261e;--verde-b:#27493a;
  --naranja:#e8904f;--naranja-osc:#f0ae7c;--naranja-cl:#2c2019;--naranja-b:#5a3b26;
  --rojo:#e08b80;--rojo-cl:#2d1c1a;--rojo-b:#5a302b;
  --tinta:#e3ebe7;--gris2:#b9c7c0;--gris:#8b9a93;--grisw:#c3c7c9;--bg:#101714;--panel:#18211d;--line:#26322c;--line2:#1d2823;--nav:#1f2a25;
  --wm:brightness(2.4);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tinta);font-size:14px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:6px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.hidden{display:none!important}
.appico{display:block}
.appico .nb{fill:var(--panel);stroke:var(--grisw)} .appico .gs{stroke:var(--grisw)} .appico .gf{fill:var(--grisw)}

/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.lcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--verde-osc);border-radius:16px;padding:26px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 12px 40px rgba(40,53,47,.1)}
.lcard .appico{width:64px;height:64px;margin:0 auto 6px}
.lcard h2{font-family:var(--disp);font-size:20px;margin-bottom:2px}
.lcard .wm{height:16px;margin:0 auto 16px;display:block;filter:var(--wm)}
.lcard input{width:100%;padding:12px;font-family:var(--mono);font-size:22px;text-align:center;letter-spacing:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.lcard input:focus{outline:none;border-color:var(--verde)}
.lerr{color:var(--rojo);font-size:12.5px;min-height:18px}

/* header */
header{background:var(--panel);border-bottom:3px solid var(--verde-osc);padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(40,53,47,.06)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .appico{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.05}
.brand small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--gris);letter-spacing:0}
.hwm{height:17px;filter:var(--wm);opacity:.9;padding-left:12px;border-left:1px solid var(--line);box-sizing:content-box}
.spacer{flex:1}
.sync{border:0;cursor:pointer;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line2);color:var(--gris);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{background:var(--verde-cl);color:var(--verde-osc)}
.sync.saving{background:var(--naranja-cl);color:var(--naranja-osc)}
.sync.off{background:var(--rojo-cl);color:var(--rojo)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:var(--gris2);flex:none}
.ibtn:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.ibtn svg{width:17px;height:17px}
@media (max-width:700px){.hwm{display:none}.sync{font-size:0;padding:5px}.sync::before{width:9px;height:9px}}

/* toolbar */
.bar{max-width:1400px;margin:0 auto;padding:12px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:12.5px;color:var(--gris2);font-weight:500}
.st b{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--tinta)}
.st.w b{color:var(--naranja-osc)} .st.r{border-color:var(--rojo-b);background:var(--rojo-cl)} .st.r b{color:var(--rojo)} .st.g b{color:var(--verde-osc)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--gris)}
.prog i{display:block;width:90px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i s{display:block;height:100%;background:linear-gradient(90deg,var(--verde-l),var(--verde-osc));text-decoration:none}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;width:220px}
.search svg{width:15px;height:15px;color:var(--gris);flex:none}
.search input{border:0;background:transparent;padding:7px 0;width:100%;font-size:14px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--verde-b)}

/* add */
.add{display:flex;gap:6px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:4px 4px 4px 12px;flex:1 1 380px;min-width:0}
.add:focus-within{border-color:var(--verde)}
.add .plus{color:var(--verde);font-weight:700;font-size:18px;line-height:1}
.add input[name=t]{flex:1;min-width:0;border:0;background:transparent;padding:7px 0;font-size:15px}
.add input[name=t]:focus{outline:none}
.add select{border:1px solid var(--line);background:var(--line2);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--gris2);font-family:var(--sans)}
.btn{font-size:13px;font-weight:600;border:1px solid var(--verde-osc);background:var(--verde-osc);color:#fff;border-radius:9px;padding:7px 14px;white-space:nowrap}
.btn:hover{background:var(--verde)}
.btn.sec{background:var(--panel);color:var(--gris2);border-color:var(--line)}
.btn.sec:hover{border-color:var(--verde);color:var(--verde-osc)}
.btn.del:hover,.btn.del.armed{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-cl)}
@media (prefers-color-scheme:dark){.btn:not(.sec),.dc.on{color:#07140d}}

/* tablero */
.board{max-width:1400px;margin:0 auto;padding:12px 16px 20px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - var(--hh) - 90px);min-height:200px;box-shadow:0 1px 3px rgba(40,53,47,.05);overflow:hidden}
.col>h2{display:flex;align-items:center;gap:8px;padding:11px 14px;font-family:var(--disp);font-size:15px;font-weight:700;border-bottom:1px solid var(--line);flex:none}
.col>h2 .n{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--naranja-cl);color:var(--naranja)}
.col.c-prox>h2 .n,.col.c-done>h2 .n{background:var(--verde-cl);color:var(--verde-osc)}
.col>h2::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--naranja)}
.col.c-prox>h2::before{background:var(--verde-b)} .col.c-done>h2::before{background:var(--verde)}
.scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.sub{position:sticky;top:0;z-index:1;background:var(--line2);padding:4px 14px;border-bottom:1px solid var(--line)}
.sub.pr{background:var(--naranja-cl);color:var(--naranja-osc)} .sub.pr .lbl{color:var(--naranja-osc)}
.sub.lt .lbl{color:var(--rojo)}
.nada{padding:22px 16px;text-align:center;color:var(--gris);font-size:13px}
.nada b{display:block;font-family:var(--disp);color:var(--verde-osc);font-size:15px}
.more{display:block;width:100%;border:0;background:none;padding:10px;color:var(--verde-osc);font-weight:600;font-size:13px;border-top:1px solid var(--line)}

/* fila compacta */
.r{display:grid;grid-template-columns:34px minmax(0,1fr) auto 30px;align-items:center;border-bottom:1px solid var(--line2);position:relative;min-height:44px}
.r::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.r.a3::before{background:var(--naranja)} .r.a7::before{background:var(--rojo)}
.r:hover{background:var(--line2)}
.r.sel{background:var(--verde-cl)}
.r .ck{border:0;background:none;height:100%;display:grid;place-items:center;padding-left:6px}
.r .ck span{width:19px;height:19px;border-radius:6px;border:2px solid var(--gris);background:var(--panel);display:grid;place-items:center}
.r.a3 .ck span{border-color:var(--naranja)} .r.a7 .ck span{border-color:var(--rojo)}
.r .ck:hover span{border-color:var(--verde)}
.r .ck svg{width:12px;height:12px;opacity:0}
.r.dn .ck span{background:var(--verde);border-color:var(--verde)} .r.dn .ck svg{opacity:1}
.r .tx{border:0;background:none;text-align:left;padding:9px 6px;min-width:0;display:block;width:100%}
.r .t1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t1 b{font-family:var(--disp);font-weight:600;font-size:14.5px}
.r .t1 em{font-style:normal;color:var(--gris);font-size:13px}
.r .t2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--gris2);margin-top:1px}
.r .t2 i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--gris);margin-right:5px}
.r .from{font-size:11px;color:var(--verde-osc);font-weight:600;margin-right:4px}
.r.dn .t1 b{text-decoration:line-through;text-decoration-color:var(--gris);opacity:.6}
.r.dn .t1 em{opacity:.6}
.meta{display:flex;gap:4px;align-items:center;padding-right:2px}
.pl{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:6px;background:var(--line2);color:var(--gris);white-space:nowrap}
.pl.w{background:var(--naranja-cl);color:var(--naranja-osc)} .pl.b{background:var(--rojo-cl);color:var(--rojo)} .pl.g{background:var(--verde-cl);color:var(--verde-osc)}
.pl.n{display:flex;align-items:center;gap:3px}
.pl.n svg{width:11px;height:11px}
.r .sr{border:0;background:none;height:100%;display:grid;place-items:center;color:var(--line);padding-right:6px}
.r .sr svg{width:17px;height:17px}
.r .sr:hover{color:var(--naranja-b)}
.r.pr .sr{color:var(--naranja)}
.r.pr{background:linear-gradient(90deg,var(--naranja-cl),transparent 60%)}
.r.pr:hover{background:var(--naranja-cl)}

/* tabs mobile */
.tabs{display:none}
@media (max-width:980px){
  .board{grid-template-columns:1fr;padding-top:10px}
  .col{max-height:none;display:none}
  .col.on{display:flex}
  .col>h2{display:none}
  .tabs{display:flex;background:var(--nav);border-radius:11px;margin:10px 16px 0}
  .tabs button{flex:1;border:0;background:none;border-radius:9px;margin:3px;padding:7px 4px;font-weight:600;font-size:13px;color:var(--gris2)}
  .tabs button[aria-selected="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}
  .tabs .pill{font-family:var(--mono);font-size:10.5px;background:var(--naranja-cl);color:var(--naranja);border-radius:999px;padding:0 6px;margin-left:4px}
  .tabs .pill.g{background:var(--verde-cl);color:var(--verde-osc)}
  .bar{padding-top:10px}
  .search{width:auto;flex:1 1 140px}
  .add{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 8px 28px rgba(40,53,47,.18);padding:5px 5px 5px 12px}
  .add input[name=t]{font-size:16px}.add select{max-width:84px;padding:6px 4px}.add .btn{padding:7px 11px}
  .board{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .prog i{width:60px}
}

/* panel detalle */
.ov{position:fixed;inset:0;background:rgba(20,30,25,.28);z-index:60;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);z-index:61;box-shadow:-10px 0 40px rgba(20,30,25,.2);display:flex;flex-direction:column;animation:slide .18s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@media (max-width:640px){.dr{top:auto;left:0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
@media (prefers-reduced-motion:reduce){.dr,.ov{animation:none}}
.dh{display:flex;gap:10px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line);border-top:4px solid var(--naranja)}
.dh.a7{border-top-color:var(--rojo)} .dh.dn{border-top-color:var(--verde)} .dh.ft{border-top-color:var(--verde-b)}
.dh .tt{flex:1;min-width:0}
.dh h3{font-family:var(--disp);font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.dh p{color:var(--gris2);margin-top:3px;overflow-wrap:anywhere}
.dh .from{font-size:12px;color:var(--verde-osc);font-weight:600;display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.db{flex:1;overflow-y:auto;padding:4px 16px 20px}
.blk{margin-top:16px}
.blk>.lbl{display:block;margin-bottom:7px}
.log{list-style:none;margin-bottom:8px;border-left:2px solid var(--naranja-b);padding-left:12px}
.log li{padding:2px 0 8px;position:relative}
.log li::before{content:'';position:absolute;left:-17px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--naranja);border:2px solid var(--panel)}
.log p{white-space:pre-wrap;overflow-wrap:anywhere}
.lmeta{display:flex;gap:10px;font-size:11px;color:var(--gris)}
.lmeta .ts{font-family:var(--mono)}
.link{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--gris)}
.link:hover{color:var(--rojo)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input{flex:1 1 180px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14px}
.row input[type=date]{flex:0 1 150px;font-family:var(--mono);font-size:13px}
.row input:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-cl)}
.dchips{display:flex;gap:5px;flex-wrap:wrap}
.dc{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--gris2)}
.dc:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.dc.on{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}
.dc input{border:0;background:transparent;font-family:var(--mono);font-size:12px;width:122px;padding:0}
.df{display:flex;gap:7px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .btn{flex:1}
.x{border:0;background:var(--line2);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--gris2);flex:none}
.x:hover{color:var(--tinta)}

.menu{position:fixed;right:14px;top:calc(var(--hh) + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(40,53,47,.16);padding:6px;z-index:50;min-width:210px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--line2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
.toast span{overflow-wrap:anywhere}
.toast button{border:0;background:none;color:var(--verde-b);font-weight:700}
@media (min-width:981px){.toast{bottom:24px}}
.dpage{max-width:720px;margin:0 auto;background:var(--panel);min-height:calc(100vh - var(--hh));display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.dpage .dh{padding:20px 20px 14px;border-top:0}
.dpage .dh{border-left:6px solid var(--naranja)} .dpage .dh.a7{border-left-color:var(--rojo)} .dpage .dh.dn{border-left-color:var(--verde)} .dpage .dh.ft{border-left-color:var(--verde-b)}
.dpage .dh h3{font-size:22px}
.dpage .db{flex:1;overflow:visible;padding:4px 20px 24px}
.dpage .df{position:sticky;bottom:0;background:var(--panel);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
</style>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function nextMonday(){var d=new Date(),k=(8-d.getDay())%7||7;d.setDate(d.getDate()+k);return iso(d)}
function daysSince(ms){var a=new Date(ms);a.setHours(0,0,0,0);var b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function daysTo(f){var a=new Date(f+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function fmtF(f){if(!f)return'';var n=daysTo(f);if(n===0)return'Hoy';if(n===1)return'Mañana';if(n===-1)return'Ayer';var d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace(/\./g,'')}
function fmtTs(ts){var d=new Date(ts),n=daysSince(ts);var h=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});if(n===0)return'hoy '+h;if(n===1)return'ayer '+h;return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+h}
function find(id){for(var i=0;i<st.tasks.length;i++)if(st.tasks[i].id===id)return st.tasks[i];return null}
function isToday(t){return !t.done&&(!t.f||t.f<=today())}
function isFut(t){return !t.done&&t.f&&t.f>today()}
function age(t){return daysSince(t.c)}
function late(t){return (t.f&&t.f<today())||age(t)>=7}

/* ============ PERSISTENCIA (JSONBin, igual que el resto de las apps) ============ */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({st:st,ver:ver,rev:rev,pushedRev:pushedRev}))}catch(e){}}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem(LS));if(o&&o.st&&Array.isArray(o.st.tasks)){st=o.st;ver=o.ver;rev=o.rev||0;pushedRev=o.pushedRev||0;return true}}catch(e){}return false}
var lastErr='';
function JH(x){var h={'X-Master-Key':JB_KEY,'Content-Type':'application/json'};for(var k in x)h[k]=x[k];return h}
function fail(r,que){return r.text().then(function(tx){var m=tx;try{var j=JSON.parse(tx);m=j.message||tx}catch(x){}throw new Error(que+' ('+r.status+'): '+m)})}
function saveBin(){try{if(BIN)localStorage.setItem('wf-pend-bin',BIN);else localStorage.removeItem('wf-pend-bin')}catch(e){}}
function findBin(){
  var n=0;
  function page(after){
    return fetch(JB+'/c/uncategorized/bins'+(after?'/'+after:''),{headers:JH(),cache:'no-store'}).then(function(r){if(!r.ok)return fail(r,'Buscar bin');return r.json()}).then(function(list){
      if(!Array.isArray(list)||!list.length)return null;
      for(var i=0;i<list.length;i++){var b=list[i];if(b&&b.snippetMeta&&b.snippetMeta.name===BIN_NAME)return b.record}
      n++;if(n>=40||list.length<10)return null;return page(list[list.length-1].record);
    });
  }
  return page('');
}
function ensureBin(){if(BIN)return Promise.resolve(BIN);return findBin().then(function(id){if(id){BIN=id;saveBin()}return BIN})}
function createBin(data){return fetch(JB+'/b',{method:'POST',headers:JH({'X-Bin-Name':BIN_NAME,'X-Bin-Private':'true'}),body:JSON.stringify(data)}).then(function(r){if(!r.ok)return fail(r,'Crear bin');return r.json()}).then(function(j){BIN=j.metadata.id;saveBin();return BIN})}
function pull(){
  return ensureBin().then(function(id){
    if(!id)return null;
    return fetch(JB+'/b/'+id+'/latest',{headers:JH({'X-Bin-Meta':'false'}),cache:'no-store'}).then(function(r){
      if(r.status===404){BIN=null;saveBin();return null}
      if(!r.ok)return fail(r,'Leer');return r.json();
    }).then(function(d){return d&&Array.isArray(d.tasks)?{data:d}:null});
  });
}
function merge(a,b){
  if(!b)return a;if(!a)return b;
  var del={},k;[a.del||{},b.del||{}].forEach(function(d){for(k in d)del[k]=Math.max(del[k]||0,d[k])});
  var map={};[a.tasks||[],b.tasks||[]].forEach(function(l){l.forEach(function(t){var x=map[t.id];if(!x||(t.u||0)>(x.u||0))map[t.id]=t})});
  var out=[];for(k in map){var t=map[k];if(!(del[k]&&del[k]>=(t.u||0)))out.push(t)}
  out.sort(function(x,y){return x.c-y.c||(x.id<y.id?-1:1)});
  var lim=Date.now()-60*864e5;for(k in del)if(del[k]<lim)delete del[k];
  return {v:2,tasks:out,del:del};
}
function sig(s){return s?JSON.stringify(s.tasks)+JSON.stringify(s.del||{}):''}
function change(){st.tmod=Date.now();rev++;saveLocal();render();schedule(1200)}
function schedule(ms){clearTimeout(timer);timer=setTimeout(push,ms||1200);setSync(online===false?'off':'saving')}
function push(){
  if(pushing||rev===pushedRev)return;
  pushing=true;var myRev=rev;setSync('saving');
  pull().then(function(row){
    if(row){var b=sig(st);st=merge(st,row.data);if(sig(st)!==b)safeRender()}else st=merge(st,{tasks:[],del:{}});
    if(!BIN)return createBin(st);
    return fetch(JB+'/b/'+BIN,{method:'PUT',headers:JH(),body:JSON.stringify(st)}).then(function(r){if(!r.ok)return fail(r,'Guardar')});
  }).then(function(){
    online=true;lastErr='';pushedRev=myRev;pushing=false;saveLocal();
    if(rev!==pushedRev)schedule(400);else setSync('ok');
  }).catch(function(e){lastErr=e&&e.message||String(e);pushing=false;online=false;setSync('off');clearTimeout(timer);timer=setTimeout(push,20000)});
}
function refresh(){
  if(pushing)return;
  pull().then(function(row){
    online=true;lastErr='';
    if(row){var b=sig(st);st=merge(st,row.data);if(sig(st)!==b){saveLocal();safeRender()}if(sig(st)!==sig(row.data))rev++}
    else rev++;
    if(rev!==pushedRev)push();else setSync('ok');
  }).catch(function(e){lastErr=e&&e.message||String(e);online=false;setSync('off')});
}

function nada(t,s){return '<div class="nada"><b>'+t+'</b>'+s+'</div>'}
function colHoy(list){
  var s=list.slice().sort(function(a,b){return (late(b)?1:0)-(late(a)?1:0)||a.c-b.c});
  var pr=s.filter(function(t){return t.p}),lt=s.filter(function(t){return!t.p&&late(t)}),rs=s.filter(function(t){return!t.p&&!late(t)});
  if(!s.length)return nada('Nada pendiente','Anotá arriba lo que vaya surgiendo.');
  var h='';
  if(pr.length)h+='<div class="sub pr"><span class="lbl">★ Prioridad · '+pr.length+'</span></div>'+pr.map(function(t){return row(t,'hoy')}).join('');
  if(lt.length)h+='<div class="sub lt"><span class="lbl">Atrasadas · '+lt.length+'</span></div>'+lt.map(function(t){return row(t,'hoy')}).join('');
  if(rs.length)h+=(pr.length||lt.length?'<div class="sub"><span class="lbl">Resto · '+rs.length+'</span></div>':'')+rs.map(function(t){return row(t,'hoy')}).join('');
  return h;
}
function colProx(list){
  var s=list.slice().sort(function(a,b){return a.f<b.f?-1:a.f>b.f?1:a.c-b.c});
  if(!s.length)return nada('Sin fechas futuras','Poné fecha a una tarea y aparece acá. Ese día pasa sola a Hoy.');
  var h='',last='';
  s.forEach(function(t){var g=fmtF(t.f);if(g!==last){h+='<div class="sub"><span class="lbl">'+esc(g)+'</span></div>';last=g}h+=row(t,'prox')});
  return h;
}
function colDone(list){
  var s=list.slice().sort(function(a,b){return b.done-a.done});
  if(!s.length)return nada('Nada cumplido todavía','Tildá una tarea y aparece acá.');
  var h='',last='';
  s.slice(0,showDone).forEach(function(t){var d=daysSince(t.done),g=d===0?'Hoy':d===1?'Ayer':new Date(t.done).toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace(/\./g,'');if(g!==last){h+='<div class="sub"><span class="lbl">'+esc(g)+'</span></div>';last=g}h+=row(t,'done')});
  if(s.length>showDone)h+='<button class="more" data-a="more">Ver más ('+(s.length-showDone)+')</button>';
  return h;
}

  var t=find(el.dataset.id);if(t){t.f=el.value;t.u=Date.now();change()}
});
app.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value.trim();var pos=e.target.selectionStart;render();var n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
app.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,k=f.dataset.form,id=f.dataset.id,t=id?find(id):null,now=Date.now();
  var v=(f.elements.t&&f.elements.t.value||'').trim();
  if(k==='add'){if(!v)return;var i=v.indexOf(':'),tt=i>0?v.slice(0,i).trim():v,dd=i>0?v.slice(i+1).trim():'',fd=f.elements.f.value;
    st.tasks.push({id:uid(),t:tt,d:dd,f:fd,p:false,c:now,u:now,done:0,log:[],from:''});
    toast(fd?'Agendada para '+fmtF(fd):'Agregada: '+tt,null);q='';refocus='.add input[name="t"]';return change()}
  if(k==='log'&&t&&v){t.log.push({t:v,ts:now});t.u=now;refocus='[data-form="log"] input';return change()}
  if(k==='sub'&&t&&v){var sf=f.elements.f.value||'';st.tasks.push({id:uid(),t:v,d:'',f:sf,p:false,c:now,u:now,done:0,log:[],from:t.t});
    t.log.push({t:'→ Derivada: '+v+(sf?' ('+fmtF(sf)+')':''),ts:now});t.u=now;refocus='[data-form="sub"] input[name="t"]';return change()}
  if(k==='edit'&&t){var nt=f.elements.t.value.trim();if(!nt)return;t.t=nt;t.d=f.elements.d.value.trim();t.u=now;editId=null;return change()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(DETAIL){if(editId){editId=null;render()}else closeDetail()}else if(menu){menu=false;render()}}});
window.addEventListener('storage',function(e){
  if(e.key!==LS||!e.newValue||!st)return;
  try{var o=JSON.parse(e.newValue);var before=JSON.stringify(st.tasks)+JSON.stringify(st.del||{});st=merge(st,o.st);
    
    if(JSON.stringify(st.tasks)+JSON.stringify(st.del||{})!==before){rev++;schedule(1500)}
    safeRender()}catch(x){}
});
function isMobile(){return matchMedia('(max-width:980px)').matches||matchMedia('(pointer:coarse)').matches}
function openTask(id){
  var url='?t='+encodeURIComponent(id);
  if(isMobile()){location.href=url;return}
  var W=580,Hh=Math.min(860,(screen.availHeight||900)-60),L=Math.max(0,(screen.availLeft||0)+(screen.availWidth||1400)-W-40),T=(screen.availTop||0)+30;
  var w=window.open(url,'pend_'+id,'popup=yes,width='+W+',height='+Hh+',left='+L+',top='+T);
  if(w){try{w.focus()}catch(x){}}else location.href=url;
}
function closeDetail(){
  if(window.opener){try{window.close()}catch(x){}}
  setTimeout(function(){if(!window.closed){if(document.referrer&&document.referrer.indexOf(location.origin)===0&&history.length>1)history.back();else location.href='./'}},150);
}
function flushAndClose(){clearTimeout(timer);push();var t0=Date.now();(function w(){if(rev===pushedRev||Date.now()-t0>2500)closeDetail();else setTimeout(w,150)})()}
function renderDetail(){
  pendingRender=false;
  var t=st&&find(DETAIL);
  var h='<header><div class="brand">'+ICON+'<h1>Pendientes<small>Seguimiento de tarea</small></h1></div><img class="hwm" src="'+WM+'" alt="Winflex S.A."><div class="spacer"></div><button id="sync" class="sync" data-a="syncinfo"></button></header>';
  if(t){document.title=t.t+' – Pendientes';h+=drawer(t)}
  else h+='<div class="dpage"><div class="nada" style="padding:48px 20px"><b>'+(st?'Esta tarea ya no existe':'Cargando…')+'</b><button class="btn sec" data-a="close" style="margin-top:12px">Volver</button></div></div>';
  if(undo)h+='<div class="toast"><span>'+esc(undo.msg)+'</span>'+(undo.fn?'<button data-a="undo">Deshacer</button>':'')+'</div>';
  app.innerHTML=h;
  var hd=app.querySelector('header');if(hd)document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px');
  setSync(online===false?'off':rev!==pushedRev?'saving':online?'ok':'');
  if(refocus){var el=app.querySelector(refocus);if(el)el.focus({preventScroll:true});refocus=null}
}
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!typing())render()},50)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){refresh();safeRender()}else if(rev!==pushedRev)push()});
window.addEventListener('online',refresh);
setInterval(function(){if(!DETAIL&&document.visibilityState==='visible')refresh()},45000);
setInterval(function(){if(!typing()&&!openId)safeRender()},60000);

function importData(d){
  var inc;
  if(d&&Array.isArray(d.tasks))inc=d;
  else if(d&&Array.isArray(d.items)){ /* respaldo de la versión anterior */
    var tasks=[],base=Date.parse((d.fecha||today())+'T09:00:00');
    d.items.forEach(function(it,i){var c=base+i*1000;tasks.push({id:it.id,t:it.area,d:it.detalle||'',f:'',p:false,c:c,u:Date.now(),done:it.done?(it.doneAt||c):0,log:(it.comments||[]).map(function(x){return{t:x.t,ts:x.ts}}),from:''});
      (it.futuras||[]).forEach(function(fu){tasks.push({id:fu.id,t:fu.t,d:'',f:fu.fecha||'',p:false,c:c,u:Date.now(),done:fu.done?c:0,log:[],from:it.area})})});
    inc={v:2,tasks:tasks,del:{}};
  }else throw new Error('formato');
  st=merge(st,inc);toast('Respaldo cargado',null);change();
}


/* ============ ARRANQUE ============ */
function start(){
  document.getElementById('login').classList.add('hidden');app.classList.remove('hidden');
  if(!loadLocal()){st=null}
  if(st)render();else app.innerHTML='<header><div class="brand">'+ICON+'<h1>Pendientes</h1></div><div class="spacer"></div><span id="sync" class="sync">Conectando…</span></header>';
  pull().then(function(row){
    online=true;
    if(row){st=st?merge(st,row.data):merge(row.data,{tasks:[],del:{}});if(sig(st)!==sig(row.data))rev++}
    else{if(!st){st=SEED}rev++}
    saveLocal();render();if(rev!==pushedRev)push();else setSync('ok');
  }).catch(function(e){lastErr=e&&e.message||String(e);online=false;if(!st){st=SEED}render();setSync('off')});
}
var okPin=false;try{okPin=localStorage.getItem('wf-pend-pin')===PIN}catch(e){}
if(okPin)start();
else{
  var L=document.getElementById('login'),P=document.getElementById('pin');L.classList.remove('hidden');P.focus();
  var go=function(){if(P.value===PIN){try{localStorage.setItem('wf-pend-pin',PIN)}catch(e){}start()}else{document.getElementById('lerr').textContent='PIN incorrecto';P.value='';P.focus()}};
  document.getElementById('lgo').onclick=go;P.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
