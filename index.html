<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#127a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<title>Winflex – Pendientes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1f9d63;--verde-osc:#127a4a;--verde-cl:#eef7f2;--verde-b:#cfe7db;
  --naranja:#d9793a;--naranja-osc:#9c5420;--naranja-cl:#fbf2ea;--naranja-b:#efd7c1;
  --rojo:#b4574c;--rojo-osc:#82322a;--rojo-cl:#faefed;--rojo-b:#eecfc9;
  --tinta:#28352f;--gris2:#42544c;--gris:#7b8b83;--bg:#eaf0ed;--panel:#fff;--line:#e5ebe8;--line2:#f0f4f2;--nav:#dde7e2;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Archivo','IBM Plex Sans',sans-serif;
  --wm:none;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --verde:#35b979;--verde-osc:#4fcb8c;--verde-cl:#16261e;--verde-b:#27493a;
  --naranja:#e8904f;--naranja-osc:#f0ae7c;--naranja-cl:#2c2019;--naranja-b:#5a3b26;
  --rojo:#e08b80;--rojo-osc:#f0aaa1;--rojo-cl:#2d1c1a;--rojo-b:#5a302b;
  --tinta:#e3ebe7;--gris2:#b9c7c0;--gris:#8b9a93;--bg:#101714;--panel:#18211d;--line:#26322c;--line2:#1d2823;--nav:#1f2a25;
  --wm:brightness(2.4);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tinta);font-size:14px;line-height:1.5;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:6px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.hidden{display:none!important}

/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.lcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--verde-osc);border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 12px 40px rgba(40,53,47,.1)}
.lcard img{height:44px;margin-bottom:10px}
.lcard h2{font-family:var(--disp);font-size:19px;margin-bottom:16px}
.lcard input{width:100%;padding:12px;font-family:var(--mono);font-size:22px;text-align:center;letter-spacing:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.lcard input:focus{outline:none;border-color:var(--verde)}
.lerr{color:var(--rojo);font-size:12.5px;min-height:18px}

/* header */
header{background:var(--panel);border-bottom:3px solid var(--verde-osc);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(40,53,47,.06)}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo .mk{height:28px;width:auto}
.logo .wm{height:18px;width:auto;filter:var(--wm)}
.logo .sub{font-size:12.5px;font-weight:500;color:var(--gris);padding-left:11px;border-left:1px solid var(--line);white-space:nowrap}
.spacer{flex:1}
.sync{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line2);color:var(--gris);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{background:var(--verde-cl);color:var(--verde-osc)}
.sync.saving{background:var(--naranja-cl);color:var(--naranja-osc)}
.sync.off{background:var(--rojo-cl);color:var(--rojo)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:var(--gris2);flex:none}
.ibtn:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.ibtn svg{width:17px;height:17px}

.wrap{max-width:820px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom,0px))}
.hoy{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 2px 0;flex-wrap:wrap}
.hoy h1{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.01em}
.hoy .pct{font-family:var(--mono);font-size:12.5px;color:var(--gris)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:0 1px 2px rgba(40,53,47,.04);border-left:4px solid var(--line)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.035em;line-height:1.2;margin-top:2px}
.kpi.k-hoy{border-left-color:var(--naranja)} .kpi.k-hoy b{color:var(--naranja-osc)}
.kpi.k-atr{border-left-color:var(--rojo)} .kpi.k-atr b{color:var(--rojo)}
.kpi.k-atr.zero{border-left-color:var(--line)} .kpi.k-atr.zero b{color:var(--gris)}
.kpi.k-prox{border-left-color:var(--verde-b)}
.kpi.k-ok{border-left-color:var(--verde)} .kpi.k-ok b{color:var(--verde-osc)}
button.kpi:hover{border-color:var(--verde-b)}
@media (max-width:560px){.kpi{padding:8px 8px 8px 9px;border-radius:10px}.kpi b{font-size:19px}.kpi .lbl{font-size:8.5px;letter-spacing:.05em}.logo .sub{display:none}}

/* tabs + search */
.navrow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
nav{display:flex;background:var(--nav);border-radius:12px;flex:1 1 auto;min-width:0}
nav button{flex:1;font-size:13.5px;font-weight:600;background:transparent;border:0;border-radius:9px;color:var(--gris2);padding:8px 8px;white-space:nowrap;margin:3px}
nav button[aria-selected="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}
nav .pill{background:var(--naranja-cl);color:var(--naranja);border-radius:999px;padding:0 6px;font-size:10.5px;margin-left:5px;font-family:var(--mono)}
nav .pill.g{background:var(--verde-cl);color:var(--verde-osc)}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 10px;flex:0 1 220px;min-width:140px}
.search svg{width:15px;height:15px;color:var(--gris);flex:none}
.search input{border:0;background:transparent;padding:9px 0;width:100%;font-size:14px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--verde-b)}
@media (max-width:560px){.search{flex:1 1 100%}nav button{font-size:12.5px;padding:7px 4px}}

.grp{margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.grp .lbl{color:var(--gris2)}
.grp::after{content:'';flex:1;height:1px;background:var(--line)}

/* cards */
.list{list-style:none}
.oc{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--naranja-b);border-radius:5px 13px 13px 5px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(40,53,47,.06)}
.oc.a3{border-left-color:var(--naranja)}
.oc.a7{border-left-color:var(--rojo);background:linear-gradient(96deg,var(--rojo-cl),var(--panel) 30%)}
.oc.fut{border-left-color:var(--verde-b)}
.oc.done{border-left-color:var(--verde);opacity:.85}
.oc.prio{box-shadow:0 0 0 1px var(--naranja-b),0 2px 10px rgba(217,121,58,.14)}
.oc.open{box-shadow:0 4px 18px rgba(40,53,47,.12)}
.top{display:grid;grid-template-columns:44px 1fr 40px;align-items:start}
.chk{border:0;background:none;padding:14px 0 0 12px;align-self:stretch;display:flex}
.chk span{width:24px;height:24px;border-radius:7px;border:2px solid var(--gris);background:var(--panel);display:grid;place-items:center;transition:.15s}
.a3 .chk span{border-color:var(--naranja)} .a7 .chk span{border-color:var(--rojo)}
.chk svg{width:14px;height:14px;opacity:0}
.chk:hover span{border-color:var(--verde)}
.done .chk span{background:var(--verde);border-color:var(--verde)}
.done .chk svg{opacity:1}
.main{border:0;background:none;text-align:left;padding:12px 4px 12px 4px;width:100%;min-width:0}
.tit{font-family:var(--disp);font-size:16.5px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.3;overflow-wrap:anywhere}
.main:hover .tit{color:var(--verde-osc)}
.det{display:block;color:var(--gris2);font-size:13.5px;margin-top:1px;overflow-wrap:anywhere}
.done .tit,.done .det{text-decoration:line-through;text-decoration-color:var(--gris);opacity:.65}
.last{display:flex;gap:6px;align-items:baseline;margin-top:6px;font-size:12.5px;color:var(--gris2);background:var(--line2);border-radius:7px;padding:4px 8px}
.last b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--gris);white-space:nowrap}
.last span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--line2);color:var(--gris);white-space:nowrap}
.chip.w{border-color:var(--naranja-b);background:var(--naranja-cl);color:var(--naranja-osc)}
.chip.b{border-color:var(--rojo-b);background:var(--rojo-cl);color:var(--rojo)}
.chip.g{border-color:var(--verde-b);background:var(--verde-cl);color:var(--verde-osc)}
.chip.m{font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:500;font-size:11px}
.star{border:0;background:none;padding:12px 10px 0 0;display:flex;justify-content:center;color:var(--line);align-self:start}
.star svg{width:21px;height:21px}
.star:hover{color:var(--naranja-b)}
.prio .star{color:var(--naranja)}

.panel{border-top:1px dashed var(--line);margin:0 14px 0 44px;padding:2px 0 14px;animation:drop .16s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.blk{margin-top:12px}
.blk>.lbl{display:block;margin-bottom:7px}
.log{list-style:none;margin-bottom:8px;border-left:2px solid var(--naranja-b);padding-left:10px}
.log li{padding:3px 0 7px;position:relative}
.log li::before{content:'';position:absolute;left:-15px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--naranja);border:2px solid var(--panel)}
.log p{white-space:pre-wrap;overflow-wrap:anywhere}
.lmeta{display:flex;gap:10px;font-size:11px;color:var(--gris)}
.lmeta .ts{font-family:var(--mono)}
.link{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--gris)}
.link:hover{color:var(--rojo)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input,.row textarea{flex:1 1 180px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14px}
.row input[type=date]{flex:0 1 150px;font-family:var(--mono);font-size:13px}
.row input:focus,.row textarea:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-cl)}
.dchips{display:flex;gap:5px;flex-wrap:wrap}
.dc{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--gris2)}
.dc:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.dc.on{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}
.dc input{border:0;background:transparent;font-family:var(--mono);font-size:12px;width:122px;padding:0}
.btn{font-size:13px;font-weight:600;border:1px solid var(--verde-osc);background:var(--verde-osc);color:#fff;border-radius:9px;padding:8px 14px;white-space:nowrap}
.btn:hover{background:var(--verde)}
.btn.sec{background:var(--panel);color:var(--gris2);border-color:var(--line)}
.btn.sec:hover{border-color:var(--verde);color:var(--verde-osc)}
.btn.del:hover,.btn.del.armed{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-cl)}
@media (prefers-color-scheme:dark){.btn:not(.sec),.dc.on{color:#07140d}}
.acts{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.from{font-size:11.5px;color:var(--verde-osc);font-weight:600;display:block;margin-bottom:1px}

.empty{background:var(--panel);border:1px dashed var(--verde-b);border-radius:14px;padding:26px 18px;text-align:center;color:var(--gris);margin-top:14px}
.empty b{display:block;font-family:var(--disp);font-size:17px;color:var(--verde-osc);margin-bottom:2px}
.more{display:block;margin:10px auto 0}

/* add bar */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(40,53,47,.06)}
.addbar form{max-width:820px;margin:0 auto}
.addbar .in{display:flex;gap:8px}
.addbar input[name=t]{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);font-size:16px}
.addbar input[name=t]:focus{outline:none;border-color:var(--verde)}
.addbar .btn{padding:0 16px;font-size:14px;border-radius:11px}
.addbar .dchips{margin-top:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.addbar .dchips::-webkit-scrollbar{display:none}.addbar .dc{flex:none}
.addbar .dchips .lbl{align-self:center;margin-right:2px}

.menu{position:absolute;right:14px;top:calc(56px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(40,53,47,.16);padding:6px;z-index:50;min-width:210px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--line2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--verde-b);font-weight:700}
</style>
</head>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function nextMonday(){var d=new Date(),k=(8-d.getDay())%7||7;d.setDate(d.getDate()+k);return iso(d)}
function daysSince(ms){var a=new Date(ms);a.setHours(0,0,0,0);var b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function daysTo(f){var a=new Date(f+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function fmtF(f){if(!f)return'';var n=daysTo(f);if(n===0)return'Hoy';if(n===1)return'Mañana';if(n===-1)return'Ayer';var d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace(/\./g,'')}

function isFut(t){return !t.done&&t.f&&t.f>today()}

function merge(a,b){
  if(!b)return a;if(!a)return b;
  var del={},k;[a.del||{},b.del||{}].forEach(function(d){for(k in d)del[k]=Math.max(del[k]||0,d[k])});
  var map={};[a.tasks||[],b.tasks||[]].forEach(function(l){l.forEach(function(t){var x=map[t.id];if(!x||(t.u||0)>(x.u||0))map[t.id]=t})});
  var out=[];for(k in map){var t=map[k];if(!(del[k]&&del[k]>=(t.u||0)))out.push(t)}
  out.sort(function(x,y){return x.c-y.c});

function push(){
  if(pushing||rev===pushedRev)return;
  pushing=true;var myRev=rev;setSync('saving');
  var p;
  if(ver==null){
    p=fetch(SB_URL,{method:'POST',headers:H({Prefer:'return=representation'}),body:JSON.stringify({clave:CLAVE,data:st,version:1})}).then(function(r){
      if(r.status===409)return 'conflict';if(!r.ok)throw new Error('post '+r.status);return r.json().then(function(rows){ver=rows[0]?rows[0].version:1;return 'ok'})});
  }else{
    p=fetch(SB_URL+'?clave=eq.'+CLAVE+'&version=eq.'+ver,{method:'PATCH',headers:H({Prefer:'return=representation'}),body:JSON.stringify({data:st,version:ver+1,actualizado:new Date().toISOString()})}).then(function(r){
      if(!r.ok)throw new Error('patch '+r.status);return r.json().then(function(rows){if(!rows.length)return 'conflict';ver=rows[0].version;return 'ok'})});
  }
  p.then(function(res){
    if(res==='conflict'){return pull().then(function(row){if(row){st=merge(st,row.data);ver=row.version}safeRender();pushing=false;saveLocal();push()})}
    online=true;pushedRev=myRev;pushing=false;saveLocal();
    if(rev!==pushedRev)schedule(300);else setSync('ok');
  }).catch(function(){pushing=false;online=false;setSync('off');clearTimeout(timer);timer=setTimeout(push,15000)});
}
function refresh(){
  if(pushing)return;

  }).catch(function(){online=false;setSync('off')});
}

  var opts=[['','Sin fecha'],[today(),'Hoy'],[addDays(1),'Mañana'],[nextMonday(),'Lunes'],[addDays(7),'+1 semana']];
  var h='<div class="dchips">',hit=false;
  opts.forEach(function(o){var on=cur===o[0];if(on)hit=true;h+='<button type="button" class="dc'+(on?' on':'')+'" data-a="'+act+'" data-id="'+(id||'')+'" data-f="'+o[0]+'">'+o[1]+'</button>'});
  h+='<label class="dc'+(!hit&&cur?' on':'')+'"><input type="date" data-a="'+act+'" data-id="'+(id||'')+'" value="'+(!hit?esc(cur):'')+'" aria-label="Elegir fecha"></label></div>';
  return h;
}
function panel(t){
  var h='<div class="panel">';
  if(editId===t.id){
    h+='<form class="blk" data-form="edit" data-id="'+t.id+'"><span class="lbl">Editar</span><div class="row" style="margin-bottom:6px"><input name="t" value="'+esc(t.t)+'" required aria-label="Título"></div><div class="row"><input name="d" value="'+esc(t.d)+'" aria-label="Detalle" placeholder="Detalle"></div><div class="acts"><button class="btn">Guardar</button><button type="button" class="btn sec" data-a="cancel">Cancelar</button></div></form>';
  }
  h+='<div class="blk"><span class="lbl">Seguimiento</span>';
  if(t.log.length){h+='<ul class="log">';t.log.forEach(function(l,i){h+='<li><p>'+esc(l.t)+'</p><div class="lmeta"><span class="ts">'+esc(fmtTs(l.ts))+'</span><button class="link" data-a="dellog" data-id="'+t.id+'" data-i="'+i+'">Quitar</button></div></li>'});h+='</ul>'}
  h+='<form class="row" data-form="log" data-id="'+t.id+'"><input name="t" placeholder="Anotá cómo va…" autocomplete="off" aria-label="Nueva nota"><button class="btn">Anotar</button></form></div>';
  if(!t.done)h+='<div class="blk"><span class="lbl">Para cuándo</span>'+dateChips(t.f,'setf',t.id)+'</div>';
  h+='<div class="blk"><span class="lbl">Tarea derivada</span><form class="row" data-form="sub" data-id="'+t.id+'"><input name="t" placeholder="Algo que sale de esta, ej.: llamar el lunes" autocomplete="off" aria-label="Nueva tarea derivada"><input type="date" name="f" aria-label="Fecha"><button class="btn">Crear</button></form></div>';
  h+='<div class="acts">'+(editId===t.id?'':'<button class="btn sec" data-a="edit" data-id="'+t.id+'">Editar</button>')+
     '<button class="btn sec del'+(armed===t.id?' armed':'')+'" data-a="del" data-id="'+t.id+'">'+(armed===t.id?'Tocá de nuevo para borrar':'Borrar')+'</button></div></div>';
  return h;
}
function render(){
  pendingRender=false;
  var all=st.tasks,T=today();
  var hoy=all.filter(isToday),fut=all.filter(isFut),done=all.filter(function(t){return t.done});
  var atr=hoy.filter(late).length;
  var hechasHoy=done.filter(function(t){return daysSince(t.done)===0}).length;
  var pct=hoy.length+hechasHoy?Math.round(hechasHoy/(hoy.length+hechasHoy)*100):0;
  var dstr=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});dstr=dstr.charAt(0).toUpperCase()+dstr.slice(1);
  var h='<header><div class="logo"><img class="mk" src="'+MK+'" alt=""><img class="wm" src="'+WM+'" alt="Winflex S.A."><span class="sub">Pendientes</span></div><div class="spacer"></div><span id="sync" class="sync"></span>'+
    '<button class="ibtn" data-a="menu" aria-label="Más opciones" aria-expanded="'+menu+'"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="10" cy="16" r="1.8"/></svg></button></header>';
  if(menu)h+='<div class="menu"><button data-a="exp">Descargar respaldo</button><button data-a="imp">Cargar respaldo</button><hr><button data-a="sync">Sincronizar ahora</button><button data-a="logout">Cerrar sesión en este equipo</button></div>';
  h+='<div class="wrap"><div class="hoy"><h1>'+esc(dstr)+'</h1><span class="pct">'+hechasHoy+(hechasHoy===1?' hecha':' hechas')+' hoy · '+pct+'%</span></div>';
  h+='<div class="kpis">'+
    '<button class="kpi k-hoy" data-a="tab" data-k="hoy"><span class="lbl">Para hoy</span><b>'+hoy.length+'</b></button>'+
    '<button class="kpi k-atr'+(atr?'':' zero')+'" data-a="tab" data-k="hoy"><span class="lbl">Atrasadas</span><b>'+atr+'</b></button>'+
    '<button class="kpi k-prox" data-a="tab" data-k="prox"><span class="lbl">Próximas</span><b>'+fut.length+'</b></button>'+
    '<button class="kpi k-ok" data-a="tab" data-k="hechas"><span class="lbl">Hechas hoy</span><b>'+hechasHoy+'</b></button></div>';
  h+='<div class="navrow"><nav role="tablist">'+tb('hoy','Hoy',hoy.length,'')+tb('prox','Próximas',fut.length,'g')+tb('hechas','Hechas',done.length,'g')+'</nav>'+
    '<label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Buscar" value="'+esc(q)+'" aria-label="Buscar"></label></div>';
  if(q){
    var r=all.filter(match).sort(function(a,b){return (a.done?1:0)-(b.done?1:0)||b.u-a.u});
    h+='<div class="grp"><span class="lbl">'+r.length+' resultado'+(r.length===1?'':'s')+'</span></div>'+(r.length?'<ul class="list">'+r.map(card).join('')+'</ul>':'<div class="empty"><b>Nada con “'+esc(q)+'”</b>Probá con otra palabra.</div>');
  }else if(tab==='hoy'){
    var sorted=hoy.slice().sort(function(a,b){return (b.p?1:0)-(a.p?1:0)||(late(b)?1:0)-(late(a)?1:0)||a.c-b.c});
    var pr=sorted.filter(function(t){return t.p}),rest=sorted.filter(function(t){return!t.p});
    if(!hoy.length)h+='<div class="empty"><b>Nada pendiente para hoy</b>'+(fut.length?'Tenés '+fut.length+' en Próximas.':'Anotá abajo lo que vaya surgiendo.')+'</div>';
    if(pr.length)h+='<div class="grp"><span class="lbl">Prioridad</span></div><ul class="list">'+pr.map(card).join('')+'</ul>';
    if(rest.length)h+=(pr.length?'<div class="grp"><span class="lbl">Resto</span></div>':'<div style="height:12px"></div>')+'<ul class="list">'+rest.map(card).join('')+'</ul>';
    var dh=done.filter(function(t){return daysSince(t.done)===0});
    if(dh.length)h+='<div class="grp"><span class="lbl">Hechas hoy</span></div><ul class="list">'+dh.sort(function(a,b){return b.done-a.done}).map(card).join('')+'</ul>';
  }else if(tab==='prox'){
    var fs=fut.slice().sort(function(a,b){return a.f<b.f?-1:a.f>b.f?1:a.c-b.c}),last='';
    if(!fs.length)h+='<div class="empty"><b>Sin tareas con fecha futura</b>Poné fecha a una tarea y aparece acá. El día que llega, pasa sola a Hoy.</div>';
    fs.forEach(function(t,i){var g=fmtF(t.f);if(g!==last){h+=(i?'</ul>':'')+'<div class="grp"><span class="lbl">'+esc(g)+'</span></div><ul class="list">';last=g}h+=card(t)});
    if(fs.length)h+='</ul>';
  }else{
    var ds=done.slice().sort(function(a,b){return b.done-a.done});
    if(!ds.length)h+='<div class="empty"><b>Todavía nada cumplido</b>Tildá una tarea y aparece acá.</div>';
    else{h+='<div style="height:12px"></div><ul class="list">'+ds.slice(0,showDone).map(card).join('')+'</ul>';if(ds.length>showDone)h+='<button class="btn sec more" data-a="more">Ver más ('+(ds.length-showDone)+')</button>'}
  }
  h+='</div>';
  h+='<div class="addbar"><form data-form="add"><div class="in"><input name="t" placeholder="Nueva tarea… (Tema: detalle)" autocomplete="off" aria-label="Nueva tarea" enterkeyhint="done"><button class="btn">Agregar</button></div>'+
     '<div class="dchips" id="addd"></div></form></div>';
  if(undo)h+='<div class="toast"><span>'+esc(undo.msg)+'</span>'+(undo.fn?'<button data-a="undo">Deshacer</button>':'')+'</div>';
  app.innerHTML=h;
  renderAddDates();
  setSync(online===false?'off':rev!==pushedRev?'saving':online?'ok':'');
  if(refocus){var el=app.querySelector(refocus);if(el)el.focus({preventScroll:true});refocus=null}
}
function renderAddDates(){var el=document.getElementById('addd');if(el)el.outerHTML=dateChips(addDate,'addf').replace('<div class="dchips">','<div class="dchips" id="addd"><span class="lbl">Para</span>')}
function tb(k,l,n,c){return '<button role="tab" data-a="tab" data-k="'+k+'" aria-selected="'+(!q&&tab===k)+'">'+l+'<span class="pill '+c+'">'+n+'</span></button>'}
function toast(msg,fn){undo={msg:msg,fn:fn};clearTimeout(toast.t);toast.t=setTimeout(function(){undo=null;safeRender()},5000)}

/* ============ ACCIONES ============ */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b){if(menu){menu=false;render()}return}if(b.tagName==='INPUT')return;
  var a=b.dataset.a,id=b.dataset.id,t=id?find(id):null;
  if(a!=='del')armed=null;
  if(a!=='menu'&&menu){menu=false;if(a==='menu')return}
  if(a==='menu'){menu=!menu;return render()}
  if(a==='tab'){tab=b.dataset.k;q='';openId=null;editId=null;return render()}
  if(a==='open'){openId=openId===id?null:id;editId=null;return render()}
  if(a==='done'&&t){
    var prev=t.done;t.done=t.done?0:Date.now();t.u=Date.now();if(openId===id)openId=null;
    if(t.done)toast('Hecha: '+t.t,function(){t.done=prev;t.u=Date.now()});
    return change();
  }
  if(a==='prio'&&t){t.p=!t.p;t.u=Date.now();return change()}
  if(a==='edit'){editId=id;refocus='[data-form="edit"] input[name="t"]';return render()}
  if(a==='cancel'){editId=null;return render()}
  if(a==='del'&&t){if(armed!==id){armed=id;return render()}armed=null;openId=null;var idx=st.tasks.indexOf(t);st.tasks.splice(idx,1);st.del=st.del||{};st.del[id]=Date.now();
    toast('Borrada: '+t.t,function(){delete st.del[id];t.u=Date.now();st.tasks.splice(idx,0,t)});return change()}
  if(a==='dellog'&&t){t.log.splice(+b.dataset.i,1);t.u=Date.now();return change()}
  if(a==='setf'&&t){t.f=b.dataset.f;t.u=Date.now();if(t.f>today())openId=null;return change()}
  if(a==='addf'){addDate=b.dataset.f;renderAddDates();return}
  if(a==='undo'&&undo){var f=undo.fn;undo=null;f();return change()}
  if(a==='more'){showDone+=40;return render()}
  if(a==='sync'){menu=false;render();return refresh()}
  if(a==='logout'){try{localStorage.removeItem('wf-pend-pin')}catch(x){}location.reload();return}
  if(a==='exp'){menu=false;render();var bl=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});var l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='pendientes-respaldo-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();return}
  if(a==='imp'){menu=false;render();var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=function(){var fr=new FileReader();fr.onload=function(){try{importData(JSON.parse(fr.result))}catch(x){alert('El archivo no es un respaldo válido.')}};fr.readAsText(inp.files[0])};inp.click();return}
});
app.addEventListener('change',function(e){
  var el=e.target;if(el.type!=='date'||!el.dataset.a||!el.value)return;
  if(el.dataset.a==='addf'){addDate=el.value;renderAddDates();return}
  var t=find(el.dataset.id);if(t){t.f=el.value;t.u=Date.now();if(t.f>today())openId=null;change()}
});
app.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value.trim();var pos=e.target.selectionStart;render();var n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
app.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,k=f.dataset.form,id=f.dataset.id,t=id?find(id):null,now=Date.now();
  var v=(f.elements.t&&f.elements.t.value||'').trim();
  if(k==='add'){if(!v)return;var i=v.indexOf(':'),tt=i>0?v.slice(0,i).trim():v,dd=i>0?v.slice(i+1).trim():'';
    st.tasks.push({id:uid(),t:tt,d:dd,f:addDate,p:false,c:now,u:now,done:0,log:[],from:''});
    if(addDate&&addDate>today())toast('Agendada para '+fmtF(addDate),null);
    addDate='';q='';refocus='.addbar input[name="t"]';return change()}
  if(k==='log'&&t&&v){t.log.push({t:v,ts:now});t.u=now;refocus='[data-form="log"][data-id="'+id+'"] input';return change()}
  if(k==='sub'&&t&&v){st.tasks.push({id:uid(),t:v,d:'',f:f.elements.f.value||'',p:false,c:now,u:now,done:0,log:[],from:t.t});
    t.log.push({t:'→ Derivada: '+v+(f.elements.f.value?' ('+fmtF(f.elements.f.value)+')':''),ts:now});t.u=now;refocus='[data-form="sub"][data-id="'+id+'"] input[name="t"]';return change()}
  if(k==='edit'&&t){var nt=f.elements.t.value.trim();if(!nt)return;t.t=nt;t.d=f.elements.d.value.trim();t.u=now;editId=null;return change()}
});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!typing())render()},50)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){refresh();safeRender()}else if(rev!==pushedRev)push()});
window.addEventListener('online',refresh);
setInterval(function(){if(document.visibilityState==='visible')refresh()},30000);
setInterval(function(){if(!typing()&&!openId)safeRender()},60000);

function importData(d){
  var inc;
  if(d&&Array.isArray(d.tasks))inc=d;
  else if(d&&Array.isArray(d.items)){ /* respaldo de la versión anterior */
    var tasks=[],base=Date.parse((d.fecha||today())+'T09:00:00');
    d.items.forEach(function(it,i){var c=base+i*1000;tasks.push({id:it.id,t:it.area,d:it.detalle||'',f:'',p:false,c:c,u:Date.now(),done:it.done?(it.doneAt||c):0,log:(it.comments||[]).map(function(x){return{t:x.t,ts:x.ts}}),from:''});
      (it.futuras||[]).forEach(function(fu){tasks.push({id:fu.id,t:fu.t,d:'',f:fu.fecha||'',p:false,c:c,u:Date.now(),done:fu.done?c:0,log:[],from:it.area})})});
    inc={v:2,tasks:tasks,del:{}};
  }else throw new Error('formato');
  st=merge(st,inc);toast('Respaldo cargado',null);change();
}

/* ============ ARRANQUE ============ */
function start(){
  document.getElementById('login').classList.add('hidden');app.classList.remove('hidden');
  if(!loadLocal()){st=null}
  if(st)render();else{app.innerHTML='<header><div class="logo"><img class="mk" src="'+MK+'" alt=""><img class="wm" src="'+WM+'" alt=""></div><div class="spacer"></div><span id="sync" class="sync">Conectando…</span></header>'}
  pull().then(function(row){
    online=true;
    if(row){st=st?merge(st,row.data):row.data;ver=row.version;if(!st.del)st.del={}}
    else{ver=null;if(!st){st=SEED}rev++}
    saveLocal();render();if(rev!==pushedRev)push();else setSync('ok');
  }).catch(function(){online=false;if(!st){st=SEED}render();setSync('off')});
}
var okPin=false;try{okPin=localStorage.getItem('wf-pend-pin')===PIN}catch(e){}
if(okPin)start();
else{
  var L=document.getElementById('login'),P=document.getElementById('pin');L.classList.remove('hidden');P.focus();
  var go=function(){if(P.value===PIN){try{localStorage.setItem('wf-pend-pin',PIN)}catch(e){}start()}else{document.getElementById('lerr').textContent='PIN incorrecto';P.value='';P.focus()}};
  document.getElementById('lgo').onclick=go;P.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
